<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AWFER — Conclusion</title>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --black: #000;
            --white: #fff;
            --gray-1: #111;
            --gray-2: #222;
            --gray-3: #333;
            --accent: #0066ff;
            --text-primary: rgba(255, 255, 255, 0.95);
            --text-secondary: rgba(255, 255, 255, 0.7);
        }

        * {
            max-width: 100%;
        }

        html, body {
            overflow-x: hidden;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            color: var(--white);
            background-color: var(--gray-1);
            line-height: 1.6;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: 100vh;

            background:
                linear-gradient(90deg,
                    rgba(0, 0, 0, 0.0) 0%,
                    rgba(0, 0, 0, 0.2) 40%,
                    rgba(0, 0, 0, 0.5) 70%,
                    rgba(0, 0, 0, 0.7) 100%),
                url("back.png") no-repeat right center;

            background-size: contain;

            pointer-events: none;
            z-index: -1;
        }

        .wrapper {
            width: min(90%, 1100px);
            margin: 0 auto;
            padding: 10rem 2rem;
            text-align: center;
        }

        .logo-wrapper {
            width: 120px;
            margin: 0 auto 3rem auto;
        }

        .logo-main {
            width: 100%;
            border-radius: 20px;
            opacity: 0.85;
        }

        .title {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 600;
            margin-bottom: 2rem;
            letter-spacing: -0.02em;

            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1s ease forwards;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 2rem auto;

            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1s ease forwards;
            animation-delay: 0.2s;
        }

        .statement {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 3rem;
        }

        /* STORE BUTTONS */

        .store-buttons {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            flex-wrap: wrap;
            margin-top: 2.5rem;
        }

        .store-btn {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            padding: 14px 26px;

            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 40px;

            text-decoration: none;
            color: white;

            transition: all 0.3s ease;
        }

        .store-btn img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            opacity: 0.9;
        }

        .store-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.2;
        }

        .store-label {
            font-size: 0.9rem;
            letter-spacing: 0.1em;
        }

        .store-coming {
            font-size: 0.7rem;
            opacity: 0.5;
            letter-spacing: 0.08em;
        }

        .store-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }

        .contact {
            margin-top: 3rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .cta {
            margin-top: 2rem;
        }

        .cta a {
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px 28px;
            border-radius: 30px;
            color: white;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
        }

        .cta a:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media(max-width:768px){
            .wrapper {
                padding: 6rem 1.5rem;
            }
        }

    </style>
</head>
 
<body>

    <div class="wrapper">

        <!-- LOGO -->
        <div class="logo-wrapper">
            <img src="assets/logo.jpg" alt="AWFER Logo" class="logo-main">
        </div>

        <!-- TITLE -->
        <div class="title">
	Welcome to your infrastructure.
        </div>

        <!-- SUBTITLE -->
        <div class="subtitle">
            Awfer exists to replace centralized control with shared direction and aligned systems.
        </div>

        <!-- STATEMENT -->
        <div class="statement">
            Not a platform.<br>
            Not an intermediary.<br>
				Not a layer on top.<br>
		Download and Discover. <br>
        </div>

        <!-- STORE BUTTONS -->
        <div class="store-buttons">

            <a href="#" class="store-btn">
                <img src="assets/android.png" alt="Android">
                <div class="store-text">
                    <div class="store-label">ANDROID</div>
                    <div class="store-coming">COMING SOON</div>
                </div>
            </a>

            <a href="#" class="store-btn">
                <img src="assets/apple.png" alt="iOS">
                <div class="store-text">
                    <div class="store-label">iOS</div>
                    <div class="store-coming">COMING SOON</div>
                </div>
            </a>

        </div>

        <!-- CONTACT -->
        <div class="contact">
            contact@awfer.net
        </div>

        <!-- CTA -->
        <div class="cta">
            <a href="index.html">← BACK TO OVERVIEW</a>
        </div>

    </div>

</body>

</html>
